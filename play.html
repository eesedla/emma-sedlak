<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emma Sedlak | Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Georgia, "Times New Roman", serif;
    cursor: url("mallet-cursor.png") 21 15, auto;
  }

  /* Custom follower cursor: native CSS cursor swaps only redraw when the
     mouse moves, so a plain :active cursor-image swap can miss a click
     that happens without motion. This element tracks the pointer in JS
     instead, so the swing transform always plays. It only takes over
     once JS confirms it's running (html.js-cursor); otherwise the native
     url() cursors above remain as the fallback. */
  html.js-cursor,
  html.js-cursor * {
    cursor: none !important;
  }

  #mallet-pointer {
    position: fixed;
    top: 0;
    left: 0;
    width: 108px;
    height: auto;
    pointer-events: none;
    z-index: 2147483647;
    opacity: 0;
    transform-origin: 73% 98%;
    transform: rotate(0deg);
    transition: transform 0.16s ease-out, opacity 0.15s linear;
  }

  #mallet-pointer.swing {
    transform: rotate(-35deg);
  }

  /* ---- hole/mole artwork colors (shared by every hole instance via <use>) ---- */

  .cls-1, .cls-2 {
          fill: #2a0800;
        }
  
        .cls-3, .cls-4 {
          fill: #945029;
        }
  
        .cls-2, .cls-5, .cls-4, .cls-6 {
          stroke: #000;
          stroke-miterlimit: 10;
        }
  
        .cls-7, .cls-6 {
          fill: #661400;
        }
  
        .cls-8 {
          fill: #c69c6d;
        }
  
        .cls-9 {
          fill: #b56c3f;
        }
  
        .cls-5, .cls-10 {
          fill: #630;
        }
  
        .cls-11 {
          fill: #a15d30;
        }

  /* ---- marquee ---- */
  .marquee {
    width: min(1242px, 94vw);
    margin: clamp(1rem, 4vw, 2.5rem) 0 0;
  }

  .marquee img {
    width: 100%;
    display: block;
  }

  .marquee a {
    display: block;
  }

  .marquee a:focus-visible {
    outline: 3px dashed #661400;
    outline-offset: 6px;
    border-radius: 8px;
  }

  .tagline {
    width: min(1242px, 94vw);
    margin: .5rem 0 0;
    text-align: center;
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic;
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    color: #661400;
  }

  /* ---- whack-a-mole nav ---- */
  .holes {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(1rem, 5vw, 3.5rem);
    width: min(1100px, 94vw);
    margin: clamp(1.5rem, 5vw, 3rem) 0;
    padding: 0;
  }

  /* mobile: stack into a pyramid - one hole on top, two below it - instead
     of the desktop's horizontal row */
  @media (max-width: 640px) {
    .holes {
      display: grid;
      grid-template-columns: repeat(2, min(260px, 40vw));
      justify-items: center;
    }

    .holes li:first-child {
      grid-column: 1 / span 2;
    }
  }

  .hole-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(260px, 27vw);
    text-decoration: none;
    background: none;
    border: 0;
    padding: 0;
    cursor: url("mallet-cursor.png") 21 15, pointer;
  }

  /* swing the mallet 35deg CCW while a hole/label is actively being clicked */
  .hole-slot:active {
    cursor: url("mallet-cursor-swing.png") 26 62, pointer;
  }

  .hole-slot svg {
    width: 100%;
    height: auto;
    overflow: hidden;
    display: block;
  }

  /* mole-reveal clips the mole to the footprint of the hole art itself
     (bottom edge of the front rim, Layer 1) so it never appears floating
     below the hole graphic while it's still rising */
  .mole-reveal {
    clip-path: url(#mole-reveal-clip);
  }

  /* mole starts sunk below the hole and rises up between the hole's back
     rim (Layer 3) and front rim (Layer 1) on hover/focus - straight move,
     no overshoot/bounce */
  .mole-layer {
    transform: translateY(950px);
    transition: transform 0.4s cubic-bezier(.22, 1, .36, 1);
  }

  .hole-slot:hover .mole-layer,
  .hole-slot:focus-visible .mole-layer {
    transform: translateY(0);
  }

  .hole-slot:focus-visible {
    outline: 3px dashed #661400;
    outline-offset: 6px;
    border-radius: 8px;
  }

  /* ---- site nav: same work/play/bio labels used on the other pages ---- */
  .labels {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(1.5rem, 6vw, 4rem);
    width: min(1100px, 94vw);
    margin: clamp(1.5rem, 5vw, 3rem) 0 0;
    padding: 0;
  }

  .labels a {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: clamp(28px, 3.2vw, 44px);
  }

  .labels img {
    height: 100%;
    width: auto;
    display: block;
  }

  /* WORK label swaps to its highlight color on hover/focus */
  .labels .nav-highlight {
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transition: opacity .15s ease;
    pointer-events: none;
  }

  .labels a:hover .nav-highlight,
  .labels a:focus-visible .nav-highlight {
    opacity: 1;
  }

  .labels a:focus-visible {
    outline: 3px dashed #661400;
    outline-offset: 6px;
    border-radius: 8px;
  }

  .top-menu {
    width: min(1100px, 94vw);
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: .5rem;
    margin: clamp(1.5rem, 5vw, 3rem) 0 0;
    font-family: "Space Mono", monospace;
    font-size: clamp(1rem, 1.9vw, 1.2rem);
    font-weight: bold;
    letter-spacing: .02em;
  }

  .top-menu a {
    color: #661400;
    text-decoration: none;
  }

  .top-menu a:hover,
  .top-menu a:focus-visible {
    text-decoration: underline;
  }

  .top-menu span {
    color: #945029;
  }
</style>
</head>

<script>
(function () {
  var pointer = document.getElementById("mallet-pointer");
  var hotspotX = 21, hotspotY = 15;
  var shown = false;

  document.documentElement.classList.add("js-cursor");

  function moveTo(x, y) {
    pointer.style.left = (x - hotspotX) + "px";
    pointer.style.top = (y - hotspotY) + "px";
    if (!shown) {
      pointer.style.opacity = 1;
      shown = true;
    }
  }

  window.addEventListener("mousemove", function (e) {
    moveTo(e.clientX, e.clientY);
  }, { passive: true });

  document.addEventListener("mouseleave", function () {
    pointer.style.opacity = 0;
    shown = false;
  });

  function swingOn(e) {
    if (e.target.closest(".hole-slot")) {
      pointer.classList.add("swing");
    }
  }
  function swingOff() {
    pointer.classList.remove("swing");
  }

  document.addEventListener("mousedown", swingOn);
  document.addEventListener("mouseup", swingOff);
  window.addEventListener("blur", swingOff);
})();
</script>
